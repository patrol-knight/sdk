[project]
name = "mission-sdk"
version = "0.1.0"
description = "SDK for distributed robotics mission workers"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.10"
strict = true
